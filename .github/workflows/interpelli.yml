name: Interpelli FVG

# Le esecuzioni programmate girano sul computer di casa (vedi windows/installa.ps1):
# dai server di GitHub Spaggiari e Axios bloccano le richieste.
# Questo workflow resta solo per prove manuali sulle fonti che rispondono anche da qui.
on:
  workflow_dispatch:
    inputs:
      prova:
        description: "Solo prova (non manda mail, mostra il riepilogo nel log)"
        type: boolean
        default: false
      solo:
        description: "Solo questi istituti (parti del nome separate da virgola), per verifiche"
        type: string
        default: ""

permissions:
  contents: write   # serve per salvare stato/visti.json (interpelli già segnalati)

concurrency:
  group: interpelli
  cancel-in-progress: false

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cerca interpelli e invia il riepilogo
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TZ: Europe/Rome
        run: |
          if [ "${{ inputs.prova }}" = "true" ]; then
            python -m interpelli --prova --solo "${{ inputs.solo }}"
          else
            python -m interpelli
          fi
      - name: Salva lo stato
        if: ${{ inputs.prova != true }}
        run: |
          git config user.name "interpelli-bot"
          git config user.email "interpelli-bot@users.noreply.github.com"
          git add stato/visti.json
          git diff --cached --quiet || git commit -m "Aggiorna interpelli già segnalati"
          git push
      - name: Conserva il riepilogo di prova
        if: ${{ inputs.prova == true }}
        uses: actions/upload-artifact@v4
        with:
          name: riepilogo
          path: riepilogo_*.html
